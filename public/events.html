<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlikler | Sosyal Etkinlik ve Aktivite Takipçisi</title>
    <!-- Font Awesome - İkonlar için -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tüm sayfalar için ortak CSS dosyası -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <section id="events-header">
        <div class="container">
            <h1>Tüm Etkinlikler</h1>
        </div>
    </section>

    <section id="events-filter">
        <div class="container">
            <div class="filter-container">
                <h2>Filtrele</h2>
                <form id="filter-form">
                    <div class="form-group">
                        <label for="category">Kategori</label>
                        <select id="category" name="category">
                            <option value="">Tüm Kategoriler</option>
                            <option value="Konser">Konser</option>
                            <option value="Festival">Festival</option>
                            <option value="Spor">Spor</option>
                            <option value="Sanat">Sanat</option>
                            <option value="Eğitim">Eğitim</option>
                            <option value="Diğer">Diğer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="location">Şehir</label>
                        <input type="text" id="location" name="location" placeholder="Şehir adı girin" autocomplete="off">
                        <div id="location-suggestions" class="suggestions-container"></div>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <section id="all-events">
        <div class="container">
            <div class="events-grid" id="events-grid">
                <!-- Events will be loaded dynamically -->
                <div class="loading">Etkinlikler yükleniyor...</div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/events.js"></script>
</body>
</html>
