<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol | Sosyal Etkinlik ve Aktivite Takipçisi</title>
    <!-- Font Awesome - İkonlar için -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tüm sayfalar için ortak CSS dosyası -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .avatar-selection {
            margin-bottom: 20px;
        }
        .avatar-selection h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .avatar-option {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .avatar-option:hover {
            transform: scale(1.1);
        }
        .avatar-option.selected {
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }
        .avatar-preview {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .avatar-preview img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-right: 15px;
        }
        .avatar-preview span {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <section id="auth-form">
        <div class="container">
            <div class="form-container">
                <h1>Kayıt Ol</h1>
                <div id="error-message" class="error hidden"></div>
                <form id="register-form">
                    <div class="form-group">
                        <label for="name">Ad Soyad</label>
                        <input type="text" id="name" name="name" required placeholder="Örn: Ahmet Yılmaz">
                    </div>
                    <div class="form-group">
                        <label for="email">E-posta Adresiniz</label>
                        <input type="email" id="email" name="email" required placeholder="ornek@mail.com">
                    </div>
                    <div class="form-group password-group">
                        <label for="password">Şifreniz</label>
                        <div class="password-input-container">
                            <input type="password" id="password" name="password" required minlength="6" placeholder="En az 6 karakter">
                            <button type="button" class="toggle-password" aria-label="Şifreyi göster/gizle">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group password-group">
                        <label for="password2">Şifre Tekrar</label>
                        <div class="password-input-container">
                            <input type="password" id="password2" name="password2" required minlength="6" placeholder="Şifrenizi tekrar girin">
                            <button type="button" class="toggle-password" aria-label="Şifreyi göster/gizle">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Avatar seçimi bölümü -->
                    <div class="form-group">
                        <label>Profil Resmi</label>
                        <div class="avatar-preview">
                            <img id="selected-avatar" src="avatar/avatar_01.png" alt="Seçili Avatar">
                            <span>Profiliniz için bir avatar seçin</span>
                        </div>
                        <div class="avatar-selection">
                            <div class="avatar-grid" id="register-avatar-options">
                                <!-- JavaScript ile doldurulacak -->
                            </div>
                            <input type="hidden" id="avatar-path" name="avatar" value="avatar/avatar_01.png">
                        </div>
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms"><a href="kullanim-kosullari.html">Kullanım Koşullarını</a> ve <a href="gizlilik-politikasi.html">Gizlilik Politikasını</a> okudum ve kabul ediyorum.</label>
                    </div>
                    <button type="submit" class="btn btn-block">Kayıt Ol</button>
                </form>
                <p class="form-footer">
                    Zaten hesabınız var mı? <a href="login.html">Giriş Yapın</a>
                </p>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/register.js"></script>
    <script src="js/password-toggle.js"></script>
</body>
</html>
