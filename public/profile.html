<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil | Sosyal Etkinlik ve Aktivite Takipçisi</title>
    <!-- Font Awesome - İkonlar için -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tüm sayfalar için ortak CSS dosyası -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .profile-header {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            padding: 30px 20px;
            position: relative;
            text-align: center;
        }
        
        .profile-avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
        }
        
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background-color: #f8f8f8;
            object-fit: cover;
        }
        
        .avatar-edit-button {
            position: absolute;
            bottom: 0;
            right: 0;
            background-color: #4CAF50;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
        }
        
        .avatar-edit-button:hover {
            background-color: #388E3C;
            transform: scale(1.1);
        }
        
        .profile-info-wrapper {
            padding: 30px;
        }
        
        .profile-tabs {
            display: flex;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }
        
        .profile-tab {
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            position: relative;
            transition: all 0.3s;
        }
        
        .profile-tab.active {
            color: #4CAF50;
        }
        
        .profile-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #4CAF50;
            border-radius: 3px 3px 0 0;
        }
        
        .profile-tab:hover {
            color: #4CAF50;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .info-item {
            margin-bottom: 20px;
        }
        
        .info-item label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        
        .info-item p {
            color: #666;
            margin: 0;
            padding: 8px 0;
        }
        
        .info-value {
            font-size: 16px;
        }
        
        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .avatar-selection {
            margin-top: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .avatar-selection h3 {
            margin-bottom: 15px;
            font-size: 16px;
            color: #333;
        }
        
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            max-height: 250px;
            overflow-y: auto;
            padding: 10px 5px;
        }
        
        .avatar-option {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .avatar-option:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }
        
        .avatar-option.selected {
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.3);
        }
        
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .event-card {
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
            height: 100%;
            background-color: white;
        }
        
        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }
        
        .event-image {
            height: 180px;
            overflow: hidden;
        }
        
        .event-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        
        .event-card:hover .event-image img {
            transform: scale(1.05);
        }
        
        .event-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .event-info h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #333;
        }
        
        .event-meta {
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
        }
        
        .event-meta p {
            margin: 5px 0;
            display: flex;
            align-items: center;
        }
        
        .event-meta i {
            width: 20px;
            margin-right: 8px;
            color: #4CAF50;
        }
        
        .event-description {
            color: #666;
            margin-bottom: 20px;
            flex-grow: 1;
        }
        
        .event-info .btn {
            align-self: flex-start;
            margin-top: auto;
        }
        
        @media (max-width: 768px) {
            .profile-tabs {
                flex-wrap: wrap;
            }
            
            .profile-tab {
                flex: 1 0 auto;
                text-align: center;
            }
            
            .avatar-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        @media (max-width: 576px) {
            .profile-avatar-wrapper {
                width: 100px;
                height: 100px;
            }
            
            .profile-avatar {
                width: 100px;
                height: 100px;
            }
            
            .avatar-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .form-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <section id="profile">
        <div class="container">
            <div class="profile-container">
                <div class="profile-header">
                    <div class="profile-avatar-wrapper">
                        <img id="current-avatar" src="avatar/avatar_01.png" alt="Profil Resmi" class="profile-avatar">
                        <div id="avatar-edit-btn" class="avatar-edit-button">
                            <i class="fas fa-camera"></i>
                        </div>
                    </div>
                    <h2 id="profile-name">Yükleniyor...</h2>
                </div>
                
                <div class="profile-info-wrapper">
                    <div class="profile-tabs">
                        <div class="profile-tab active" data-tab="info">Profil Bilgileri</div>
                        <div class="profile-tab" data-tab="events">Katıldığım Etkinlikler</div>
                    </div>
                    
                    <!-- Profil Bilgileri Tab İçeriği -->
                    <div id="tab-info" class="tab-content active">
                        <div id="profile-details">
                            <div class="info-item">
                                <label>Ad Soyad</label>
                                <p id="profile-name-value" class="info-value">Yükleniyor...</p>
                            </div>
                            <div class="info-item">
                                <label>E-posta</label>
                                <p id="profile-email" class="info-value">Yükleniyor...</p>
                            </div>
                            <button id="edit-profile-btn" class="btn btn-primary">
                                <i class="fas fa-edit"></i> Profili Düzenle
                            </button>
                        </div>
                        
                        <!-- Profil düzenleme formu (başlangıçta gizli) -->
                        <div id="profile-edit-form" style="display: none;">
                            <form id="edit-form">
                                <div class="info-item">
                                    <label for="edit-name">Ad Soyad</label>
                                    <input type="text" id="edit-name" name="name" class="form-control" required>
                                </div>
                                <div class="info-item">
                                    <label for="edit-email">E-posta</label>
                                    <input type="email" id="edit-email" name="email" class="form-control" required>
                                </div>
                                <div class="form-buttons">
                                    <button type="submit" class="btn btn-primary">Kaydet</button>
                                    <button type="button" id="cancel-edit" class="btn btn-outline">İptal</button>
                                </div>
                            </form>
                        </div>
                        
                        <!-- Avatar seçim paneli (başlangıçta gizli) -->
                        <div id="avatar-selection-panel" style="display: none;">
                            <div class="avatar-selection">
                                <h3>Avatar Seçin</h3>
                                <div class="avatar-grid" id="avatar-options">
                                    <!-- Avatar seçenekleri JavaScript ile yüklenecek -->
                                </div>
                                <div class="form-buttons">
                                    <button id="save-avatar" class="btn btn-primary">Avatarı Kaydet</button>
                                    <button id="cancel-avatar" class="btn btn-outline">İptal</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Katıldığım Etkinlikler Tab İçeriği -->
                    <div id="tab-events" class="tab-content">
                        <div class="events-grid" id="joined-events">
                            <!-- Joined events will be loaded dynamically -->
                            <div class="loading">Etkinlikler yükleniyor...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <!-- JavaScript dosyaları -->
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
